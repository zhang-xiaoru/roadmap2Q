name: Publish

# Renders the Quarto book and deploys it to GitHub Pages on every push to main.
# The site is rendered from the committed _freeze/ cache, so the CI runner does
# NOT need Python — refresh _freeze/ locally (quarto render) whenever you change
# a `{python}` chapter, and commit it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
